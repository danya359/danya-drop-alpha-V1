<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>danyadrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Oswald:wght@500;700&amp;display=swap">
<style>

body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
:root{--bg:#07060F;--bg2:#0B0818;--panel:#100C22;--line:#2B1D5C;--line2:#41308A;--accent:#00F0FF;--fg:#EAF0FF;--muted:#8F8CC4;--dis:#241C48;--glow:rgba(0,240,255,.38);--glow2:rgba(0,240,255,.14)}
body::before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 10% -8%,var(--glow2),transparent 62%),radial-gradient(760px 520px at 100% 0%,rgba(255,43,214,.12),transparent 60%)}
.root,.auth-wrap{background:transparent!important}
button{transition:box-shadow .15s}
button:active{transform:scale(.98)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--glow2)}
@keyframes ddspin{to{transform:rotate(360deg)}}
@keyframes ddpulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ddrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin-slow{animation:ddspin 26s linear infinite}
.spin-rev{animation:ddspin 40s linear infinite reverse}
.pulse{animation:ddpulse 1.8s ease-in-out infinite}
.rise{animation:ddrise .45s ease both}
.case-card{transition:transform .18s,box-shadow .18s,border-color .18s}
.case-card:hover{transform:translateY(-5px);border-color:var(--accent)!important;box-shadow:0 12px 34px -12px var(--glow)}
button[onclick]:hover,button:not([disabled]):hover{filter:brightness(1.12)}
html[data-glow="on"] .logo{text-shadow:0 0 10px var(--accent),0 0 26px var(--glow)}
html[data-glow="on"] h2{text-shadow:0 0 16px var(--glow)}
html[data-glow="on"] button[style*="background: var(--accent)"]{box-shadow:0 0 16px var(--glow)}
html[data-glow="on"] [style*="background: var(--panel)"]{box-shadow:0 0 22px -8px var(--glow)}
html[data-menu="bottom"] .tabs{position:fixed!important;left:0;right:0;bottom:0;z-index:40;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px!important;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:2px solid var(--line);box-shadow:0 -6px 24px -10px var(--glow)}
html[data-menu="bottom"] .tabs button{padding:0 4px!important;min-height:50px!important;font-size:14px!important;letter-spacing:0.03em!important}
html[data-menu="bottom"] .root{padding-bottom:112px!important}
@media (min-width:701px){
html[data-menu="left"] .tabs{position:fixed!important;left:0;top:0;bottom:0;width:168px;z-index:40;display:flex!important;flex-direction:column;flex-wrap:nowrap!important;gap:10px!important;padding:20px 12px;background:var(--bg2);border-right:2px solid var(--line);overflow-y:auto;box-sizing:border-box;box-shadow:6px 0 24px -10px var(--glow)}
html[data-menu="left"] .tabs button{padding:0 10px!important;font-size:15px!important;text-align:left}
html[data-menu="left"] .root{padding-left:calc(168px + 40px)!important;max-width:none!important;margin:0!important;width:auto!important}
}
button{font-family:'Inter',system-ui,sans-serif}
input,textarea{font-family:'Inter',system-ui,sans-serif}
@media (max-width:700px){
.root{padding-left:max(14px,env(safe-area-inset-left,0px))!important;padding-right:max(14px,env(safe-area-inset-right,0px))!important;gap:22px!important;padding-bottom:104px!important}
.hdr{padding:14px 0!important}
.stats{width:100%!important;gap:8px!important}
.stats > *{flex:1 1 auto!important;padding-left:12px!important;padding-right:12px!important}
.tabs{position:fixed!important;left:0;right:0;bottom:0;top:auto;width:auto;z-index:40;display:grid!important;flex-direction:row;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px!important;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:2px solid var(--line);border-right:0;box-shadow:0 -6px 24px -10px var(--glow);overflow:visible}
html[data-menu="top"] .tabs{bottom:auto;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;border-top:0;border-bottom:2px solid var(--line);box-shadow:0 6px 24px -10px var(--glow)}
html[data-menu="top"] .root{padding-top:76px!important;padding-bottom:40px!important}
html[data-menu="left"] .root,html[data-menu="bottom"] .root{padding-left:max(14px,env(safe-area-inset-left,0px))!important;padding-bottom:104px!important}
.tabs button{padding:0 2px!important;min-height:46px!important;font-size:9.5px!important;letter-spacing:0!important;line-height:1.15;text-align:center!important}
h2{font-size:28px!important}
.case-card{flex:1 1 calc(50% - 10px)!important;padding:12px!important}
.case-card svg{width:104px!important;height:auto!important}
.rw-card{flex:1 1 calc(50% - 6px)!important}
.modal-wrap{padding:8px!important}
.modal-card{padding:14px!important}
}

</style>
</head>

<sc-if value="{{ showAuth }}" hint-placeholder-val="{{ false }}">
<div class="auth-wrap" style="min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)">
<form onSubmit="{{ authSubmit }}" style="width:100%;max-width:420px;box-sizing:border-box;padding:28px 22px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;gap:14px">
<div class="logo" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;letter-spacing:0.04em;text-transform:uppercase;text-align:center">danya<span style="color:var(--accent)">drop</span></div>
<div style="display:flex;gap:8px">
<button type="button" onClick="{{ goLogin }}" style="flex:1 1 0;min-height:48px;border-radius:8px;border:2px solid {{authLoginBorder}};background:{{authLoginBg}};color:{{authLoginFg}};font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u0412\u0445\u043E\u0434</button>
<button type="button" onClick="{{ goRegister }}" style="flex:1 1 0;min-height:48px;border-radius:8px;border:2px solid {{authRegBorder}};background:{{authRegBg}};color:{{authRegFg}};font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044F</button>
</div>
<sc-if value="{{ authIsReg }}" hint-placeholder-val="{{ false }}">
<label for="authNick" style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u041D\u0438\u043A\u043D\u0435\u0439\u043C</label>
<input id="authNick" type="text" value="{{authNick}}" onChange="{{ onAuthNick }}" placeholder="\u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, danya" style="width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-size:17px">
</sc-if>
<sc-if value="{{ authIsLogin }}" hint-placeholder-val="{{ true }}">
<label for="authId" style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">ID \u0430\u043A\u043A\u0430\u0443\u043D\u0442\u0430</label>
<input id="authId" type="text" inputmode="numeric" value="{{authId}}" onChange="{{ onAuthId }}" placeholder="\u041D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, 12345678" style="width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-size:17px;letter-spacing:0.08em">
</sc-if>
<label for="authPass" style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u041F\u0430\u0440\u043E\u043B\u044C</label>
<input id="authPass" type="password" value="{{authPass}}" onChange="{{ onAuthPass }}" placeholder="\u041D\u0435 \u043A\u043E\u0440\u043E\u0447\u0435 4 \u0441\u0438\u043C\u0432\u043E\u043B\u043E\u0432" style="width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-size:17px">
<sc-if value="{{ authIsReg }}" hint-placeholder-val="{{ false }}">
<label for="authPass2" style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u041F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u0435 \u043F\u0430\u0440\u043E\u043B\u044C</label>
<input id="authPass2" type="password" value="{{authPass2}}" onChange="{{ onAuthPass2 }}" placeholder="\u0415\u0449\u0451 \u0440\u0430\u0437 \u0442\u043E\u0442 \u0436\u0435 \u043F\u0430\u0440\u043E\u043B\u044C" style="width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-size:17px">
</sc-if>
<label for="authRemember" style="display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg);min-height:44px">
<input id="authRemember" type="checkbox" checked="{{authRemember}}" onChange="{{ onAuthRemember }}" style="width:22px;height:22px;margin:0">
\u0417\u0430\u043F\u043E\u043C\u043D\u0438\u0442\u044C \u043C\u0435\u043D\u044F \u043D\u0430 \u044D\u0442\u043E\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435
</label>
<sc-if value="{{ hasAuthMsg }}" hint-placeholder-val="{{ false }}">
<div style="padding:12px 14px;border-radius:8px;background:var(--bg);border-left:6px solid {{authMsgColor}};font-size:15px;font-weight:600">{{authMsgText}}</div>
</sc-if>
<button type="submit" style="min-height:54px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">{{authSubmitLabel}}</button>
<button type="button" onClick="{{ toggleImport }}" style="min-height:44px;border-radius:8px;border:2px solid var(--line2);background:transparent;color:var(--fg);font-size:14px;font-weight:600;cursor:pointer">\u041F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438 \u0430\u043A\u043A\u0430\u0443\u043D\u0442 \u0441 \u0434\u0440\u0443\u0433\u043E\u0433\u043E \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430</button>
<sc-if value="{{ authImportOpen }}" hint-placeholder-val="{{ false }}">
<textarea id="authImport" rows="3" value="{{authImport}}" onChange="{{ onAuthImport }}" placeholder="\u0412\u0441\u0442\u0430\u0432\u044C\u0442\u0435 \u043A\u043E\u0434 \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0438\u0437 \u043F\u0440\u043E\u0444\u0438\u043B\u044F" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-size:13px;resize:vertical"></textarea>
<button type="button" onClick="{{ importAccount }}" style="min-height:48px;border:2px solid var(--accent);border-radius:8px;background:transparent;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer">\u041F\u0435\u0440\u0435\u043D\u0435\u0441\u0442\u0438</button>
</sc-if>
<div style="font-size:12px;line-height:1.5;color:var(--muted)">\u041F\u0440\u0438 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0432\u044B \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u0435 ID. \u0414\u043B\u044F \u0432\u0445\u043E\u0434\u0430 \u043D\u0443\u0436\u043D\u044B \u0442\u043E\u043B\u044C\u043A\u043E ID \u0438 \u043F\u0430\u0440\u043E\u043B\u044C. \u0410\u043A\u043A\u0430\u0443\u043D\u0442\u044B \u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u043D\u0430 \u044D\u0442\u043E\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435, \u0430 \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0441 \u043D\u0430 \u0434\u0440\u0443\u0433\u043E\u0435 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u043E \u043F\u0435\u0440\u0435\u043D\u043E\u0441\u0438\u0442\u0441\u044F \u043A\u043E\u0434\u043E\u043C \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0432 \u043F\u0440\u043E\u0444\u0438\u043B\u0435.</div>
</form>
</div>
</sc-if>

<sc-if value="{{ showGame }}" hint-placeholder-val="{{ false }}">
<div class="root" style="width:100%;max-width:1360px;margin:0 auto;box-sizing:border-box;background:var(--bg);display:flex;flex-direction:column;gap:32px;padding:0 48px 56px">

<div class="hdr" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:24px 0;border-bottom:2px solid var(--line)">
<div class="logo" style="font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:0.04em;text-transform:uppercase">danya<span style="color:var(--accent)">drop</span></div>
<div class="stats" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
<div style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;background:var(--panel);border:2px solid var(--line)">
<div style="font-size:13px;color:var(--muted)">\u0412 \u0438\u0433\u0440\u0435</div>
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:0.04em;font-variant-numeric:tabular-nums">{{playedText}}</div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;background:var(--panel);border:2px solid var(--line)">
<div style="width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">\u0414</div>
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:0.02em;font-variant-numeric:tabular-nums">{{balanceText}}</div>
</div>
<button type="button" onClick="{{ openTrade }}" style="min-height:48px;padding:0 16px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer">\u041E\u0431\u043C\u0435\u043D</button>
<button type="button" onClick="{{ openProfile }}" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 8px;border-radius:8px;border:2px solid var(--line2);background:transparent;color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;max-width:200px;overflow:hidden">
<svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true" style="flex:0 0 auto"><circle cx="12" cy="12" r="12" style="fill:{{avBg}}"></circle><path d="{{avPath}}" transform="translate(4.8 4.8) scale(0.6)" style="fill:{{avFg}};fill-rule:evenodd"></path></svg>
<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{userName}}</span>
</button>
</div>
</div>

<div class="tabs" style="display:flex;flex-wrap:wrap;gap:12px">
<button type="button" onClick="{{ goCases }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabCasesBorder}};background:{{tabCasesBg}};color:{{tabCasesFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u041A\u0435\u0439\u0441\u044B</button>
<button type="button" onClick="{{ goInv }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabIBorder}};background:{{tabIBg}};color:{{tabIFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u0418\u043D\u0432\u0435\u043D\u0442\u0430\u0440\u044C</button>
<button type="button" onClick="{{ goUpgrade }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabUpBorder}};background:{{tabUpBg}};color:{{tabUpFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u0410\u043F\u0433\u0440\u0435\u0439\u0434</button>
<button type="button" onClick="{{ goQuests }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabQBorder}};background:{{tabQBg}};color:{{tabQFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">{{tabQLabel}}</button>
<button type="button" onClick="{{ goPromo }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabPBorder}};background:{{tabPBg}};color:{{tabPFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">{{tabPLabel}}</button>
<button type="button" onClick="{{ goSettings }}" style="min-height:48px;padding:0 24px;border-radius:8px;border:2px solid {{tabSBorder}};background:{{tabSBg}};color:{{tabSFg}};font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer">\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438</button>
</div>

<div style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.04em;text-transform:uppercase">\u041D\u0430\u0433\u0440\u0430\u0434\u044B \u0437\u0430 \u0432\u0440\u0435\u043C\u044F \u0432 \u0438\u0433\u0440\u0435</div>
<div style="font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums">{{nextRewardText}}</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<sc-for list="{{ rewards }}" as="rw" hint-placeholder-count="6">
<div class="rw-card" style="flex:1 1 150px;min-width:0;box-sizing:border-box;padding:14px 16px;border-radius:8px;background:var(--panel);border:2px solid {{rw.border}};display:flex;flex-direction:column;gap:8px">
<div style="font-size:13px;color:var(--muted)">{{rw.label}}</div>
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;color:{{rw.amountColor}}">+{{rw.amountText}}</div>
<button type="button" onClick="{{ rw.claim }}" disabled="{{ rw.disabled }}" style="min-height:44px;border:0;border-radius:6px;background:{{rw.btnBg}};color:{{rw.btnFg}};font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer">{{rw.btnLabel}}</button>
</div>
</sc-for>
</div>
</div>

<sc-if value="{{ showCasesView }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">

<div style="font-size:15px;color:var(--muted)">\u041D\u043E\u0432\u044B\u0439 \u043F\u0440\u043E\u043C\u043E\u043A\u043E\u0434 \u0434\u0430\u0451\u0442\u0441\u044F \u0437\u0430 \u043A\u0430\u0436\u0434\u044B\u0439 \u0447\u0430\u0441 \u0432 \u0438\u0433\u0440\u0435, \u043F\u0435\u0440\u0432\u044B\u0439 \u0443\u0436\u0435 \u0443 \u0432\u0430\u0441. \u041D\u0430\u0433\u0440\u0430\u0434\u0430: \u0434\u0430\u043D\u044C\u043A\u0438, \u043A\u0435\u0439\u0441 \u0432 \u0438\u043D\u0432\u0435\u043D\u0442\u0430\u0440\u044C \u0438\u043B\u0438 \u0441\u043A\u0438\u043D \u043E\u0442 600 \u0434\u0430\u043D\u044C\u043A\u043E\u0432.</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:12px;background:var(--panel);border:2px solid var(--line)">
<label for="promoInput" style="font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u043F\u0440\u043E\u043C\u043E\u043A\u043E\u0434</label>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<input id="promoInput" type="text" value="{{promoInput}}" onChange="{{ onPromoInput }}" placeholder="0000-0000" style="flex:1 1 220px;min-width:0;box-sizing:border-box;min-height:52px;padding:0 18px;border-radius:8px;border:2px solid var(--line2);background:var(--bg);color:var(--fg);font-family:'Oswald',sans-serif;font-size:24px;letter-spacing:0.12em">
<button type="button" onClick="{{ promoSubmit }}" style="min-height:52px;padding:0 32px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font-size:16px;font-weight:600;cursor:pointer">\u0410\u043A\u0442\u0438\u0432\u0438\u0440\u043E\u0432\u0430\u0442\u044C</button>
</div>
<sc-if value="{{ hasPromoMsg }}" hint-placeholder-val="{{ false }}">
<div style="padding:12px 16px;border-radius:8px;background:var(--bg);border-left:6px solid {{promoMsgColor}};font-size:15px;font-weight:600">{{promoMsgText}}</div>
</sc-if>
<div style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums">{{nextPromoText}}</div>
</div>
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.04em;text-transform:uppercase">\u0412\u0430\u0448\u0438 \u043F\u0440\u043E\u043C\u043E\u043A\u043E\u0434\u044B</div>
<sc-if value="{{ noPromo }}" hint-placeholder-val="{{ false }}">
<div style="padding:28px 20px;border-radius:12px;border:2px dashed var(--line2);color:var(--muted);font-size:15px;text-align:center">\u041F\u0440\u043E\u043C\u043E\u043A\u043E\u0434 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0447\u0435\u0440\u0435\u0437 \u0441\u0435\u043A\u0443\u043D\u0434\u0443.</div>
</sc-if>
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ promoList }}" as="pc" hint-placeholder-count="1">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 20px;border-radius:10px;background:var(--panel);border:2px solid var(--line)">
<div style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px">
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:0.14em;font-variant-numeric:tabular-nums">{{pc.codeText}}</div>
<div style="font-size:13px;color:{{pc.statusColor}}">{{pc.statusText}}</div>
</div>
<button type="button" onClick="{{ pc.activate }}" disabled="{{ pc.disabled }}" style="min-height:48px;min-width:150px;padding:0 24px;border:0;border-radius:8px;background:{{pc.btnBg}};color:{{pc.btnFg}};font-size:15px;font-weight:600;cursor:pointer">{{pc.btnLabel}}</button>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ showQuestsView }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
<h2 style="margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;letter-spacing:0.04em;text-transform:uppercase">\u041A\u0432\u0435\u0441\u0442\u044B</h2>
<div style="font-size:15px;color:var(--muted)">\u0412\u044B\u043F\u043E\u043B\u043D\u0438\u0442\u0435 \u0437\u0430\u0434\u0430\u043D\u0438\u0435 \u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \xAB\u0417\u0430\u0431\u0440\u0430\u0442\u044C\xBB, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u043B\u0443\u0447\u0438\u0442\u044C \u0434\u0430\u043D\u044C\u043A\u0438</div>
</div>
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ quests }}" as="q" hint-placeholder-count="5">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 20px;border-radius:10px;background:var(--panel);border:2px solid {{q.border}}">
<div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px">
<div style="font-size:17px;font-weight:600">{{q.title}}</div>
<div style="height:10px;border-radius:5px;background:var(--bg);overflow:hidden"><div style="height:100%;background:{{q.barColor}};width:{{q.pct}}%"></div></div>
<div style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums">{{q.progText}}</div>
</div>
<div style="display:flex;align-items:center;gap:8px;font-family:'Oswald',sans-serif;font-weight:700;font-size:24px;color:var(--accent)">+{{q.rewardText}}<span style="font-size:14px;font-weight:500;color:var(--muted)">\u0434\u0430\u043D\u044C\u043A\u043E\u0432</span></div>
<button type="button" onClick="{{ q.claim }}" disabled="{{ q.disabled }}" style="min-height:48px;min-width:140px;padding:0 24px;border:0;border-radius:8px;background:{{q.btnBg}};color:{{q.btnFg}};font-size:15px;font-weight:600;cursor:pointer">{{q.btnLabel}}</button>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ showUpgradeView }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px">
<h2 style="margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:40px;letter-spacing:0.04em;text-transform:uppercase">\u0410\u043F\u0433\u0440\u0435\u0439\u0434</h2>
<div style="font-size:15px;color:var(--muted)">\u041E\u0442\u0434\u0430\u0439\u0442\u0435 \u0434\u043E 6 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u043E\u0432 \u0438 \u0432\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u043B\u044E\u0431\u043E\u0439, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u0434\u043E\u0440\u043E\u0436\u0435 \u0438\u0445 \u0441\u0443\u043C\u043C\u044B. \u0427\u0435\u043C \u043E\u043D \u0434\u043E\u0440\u043E\u0436\u0435, \u0442\u0435\u043C \u043C\u0435\u043D\u044C\u0448\u0435 \u0437\u0435\u043B\u0451\u043D\u0430\u044F \u0447\u0430\u0441\u0442\u044C \u043A\u0440\u0443\u0433\u0430.</div>
</div>

<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px;border-radius:14px;background:var(--panel);border:2px solid var(--line);overflow:hidden">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%">
<div style="padding:12px 14px;border-radius:10px;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0"><div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u0412\u0430\u0448\u0430 \u0441\u0443\u043C\u043C\u0430</div><div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--fg)">{{upSelTotal}}</div></div>
<div style="padding:12px 14px;border-radius:10px;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0"><div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u0426\u0435\u043D\u0430 \u0446\u0435\u043B\u0438</div><div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--fg)">{{upStatTgt}}</div></div>
<div style="padding:12px 14px;border-radius:10px;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0"><div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u041C\u043D\u043E\u0436\u0438\u0442\u0435\u043B\u044C</div><div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:#FF2BD6">{{upStatMult}}</div></div>
<div style="padding:12px 14px;border-radius:10px;background:var(--bg);border:2px solid var(--accent);display:flex;flex-direction:column;gap:2px;min-width:0"><div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u0428\u0430\u043D\u0441 \u0443\u0441\u043F\u0435\u0445\u0430</div><div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:#39FF14">{{upChanceText}}</div></div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:8px;width:100%;align-items:center">
<button type="button" onClick="{{ upMax }}" style="min-height:40px;padding:0 16px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);font-size:13px;font-weight:600;cursor:pointer">6 \u0441\u0430\u043C\u044B\u0445 \u0434\u043E\u0440\u043E\u0433\u0438\u0445</button>
<button type="button" onClick="{{ upClear }}" style="min-height:40px;padding:0 16px;border-radius:8px;border:2px solid var(--line2);background:transparent;color:var(--fg);font-size:13px;font-weight:600;cursor:pointer">\u041E\u0447\u0438\u0441\u0442\u0438\u0442\u044C</button>
<div style="font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 8px">\u0426\u0435\u043B\u044C</div>
<sc-for list="{{ multOpts }}" as="mo" hint-placeholder-count="0">
<button type="button" onClick="{{ mo.pick }}" style="min-height:40px;padding:0 14px;border-radius:8px;border:2px solid {{mo.border}};background:{{mo.bg}};color:{{mo.fg}};font-size:13px;font-weight:600;cursor:pointer">{{mo.label}}</button>
</sc-for>
</div>

<div style="width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)"><span>\u041E\u0442\u0434\u0430\u0451\u0442\u0435: {{upSelCount}} \u0438\u0437 6</span><span style="color:var(--accent)">\u0421\u0443\u043C\u043C\u0430: {{upSelTotal}}</span></div>
<sc-if value="{{ upNoSel }}" hint-placeholder-val="{{ true }}">
<div style="padding:24px 16px;border-radius:10px;border:2px dashed var(--line2);color:var(--muted);font-size:15px;text-align:center">\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u043E\u0442 1 \u0434\u043E 6 \u043F\u0440\u0435\u0434\u043C\u0435\u0442\u043E\u0432 \u0438\u0437 \u0438\u043D\u0432\u0435\u043D\u0442\u0430\u0440\u044F \u043D\u0438\u0436\u0435</div>
</sc-if>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px">
<sc-for list="{{ upSel }}" as="x" hint-placeholder-count="0">
<div style="flex:0 1 180px;min-width:0;box-sizing:border-box;padding:12px;border-radius:10px;background:var(--bg);border:2px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:6px">
<svg viewBox="0 0 200 64" width="130" height="42" aria-hidden="true"><ellipse cx="100" cy="61" rx="78" ry="2.2" style="fill:#000;opacity:0.35"></ellipse><path d="{{x.aDark}}" style="fill:#2A3039;stroke:#0A0C10;stroke-width:1;stroke-linejoin:round"></path><path d="{{x.aBody}}" style="fill:{{x.aBase}};stroke:#0A0C10;stroke-width:1;stroke-linejoin:round"></path><path d="{{x.aF1}}" style="fill:{{x.aAcc}}"></path><path d="{{x.aF2}}" style="fill:{{x.aAcc2}}"></path><path d="{{x.aL1}}" style="fill:none;stroke:{{x.aAcc}};stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round"></path><path d="{{x.aPl}}" style="fill:none;stroke:{{x.aAcc2}};stroke-width:1.6;stroke-linecap:round"></path><path d="{{x.aHi}}" style="fill:#fff;opacity:0.2"></path><path d="{{x.aSh}}" style="fill:#000;opacity:0.3"></path><path d="{{x.aWear}}" style="fill:none;stroke:#fff;stroke-width:0.5;opacity:0.4"></path></svg>
<div style="width:100%;height:4px;border-radius:2px;background:{{x.color}}"></div>
<div style="font-size:14px;font-weight:600">{{x.name}}</div>
<div style="font-size:13px;color:var(--accent)">{{x.valueText}}</div>
<div style="font-size:12px;color:{{x.patColor}}">{{x.patText}}</div>
<div style="font-size:12px;font-weight:600;color:{{x.stColor}}">{{x.stText}}</div>
</div>
</sc-for>
</div>
</div>


<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px;width:100%">
<div style="position:relative;width:min(320px,100%);aspect-ratio:1/1;flex:0 0 auto">
<svg viewBox="0 0 200 200" style="position:absolute;left:0;top:0;width:100%;height:100%" aria-hidden="true">
<g class="spin-slow" style="transform-origin:100px 100px"><circle cx="100" cy="100" r="97" style="fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:2 7;opacity:0.7"></circle></g>
<g class="spin-rev" style="transform-origin:100px 100px"><circle cx="100" cy="100" r="93" style="fill:none;stroke:#FF2BD6;stroke-width:0.8;stroke-dasharray:14 10;opacity:0.5"></circle></g>
<circle cx="100" cy="100" r="78" style="fill:none;stroke:#3A1048;stroke-width:20"></circle>
<circle cx="100" cy="100" r="78" transform="rotate(-90 100 100)" style="fill:none;stroke:#39FF14;stroke-width:20;stroke-dasharray:{{upDash}} 1000;filter:drop-shadow(0 0 5px #39FF14)"></circle>
<circle cx="100" cy="100" r="88.5" style="fill:none;stroke:var(--line2);stroke-width:1"></circle>
<circle cx="100" cy="100" r="67.5" style="fill:none;stroke:var(--line2);stroke-width:1"></circle>
<path d="{{upTicks}}" style="fill:none;stroke:var(--line2);stroke-width:1"></path>
<circle cx="100" cy="100" r="58" style="fill:var(--bg);stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 0 6px var(--accent))"></circle>
</svg>
<div style="position:absolute;left:0;top:0;width:100%;height:100%;transform:rotate({{upAngle}}deg);transition:{{upTrans}}">
<svg viewBox="0 0 200 200" style="width:100%;height:100%" aria-hidden="true"><path d="M95 46L100 3L105 46Z" style="fill:#FFFFFF;stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--accent))"></path></svg>
</div>
<div class="{{upPulse}}" style="position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
<div style="font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">\u0428\u0430\u043D\u0441</div>
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;line-height:1.1;color:var(--fg);text-shadow:0 0 14px var(--glow)">{{upChanceText}}</div>
<div style="display:flex;gap:10px;font-size:11px;color:var(--muted)"><span style="color:#39FF14">\u0443\u0441\u043F\u0435\u0445</span><span style="color:#B04BFF">\u043D\u0435\u0443\u0434\u0430\u0447\u0430</span></div>
</div>
</div>

<div style="flex:1 1 280px;max-width:380px;box-sizing:border-box;padding:16px 18px;border-radius:12px;background:var(--bg);border:2px solid {{upTgtBorder}};box-shadow:0 0 22px -8px {{upTgtBorder}};display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
<svg viewBox="0 0 200 64" width="220" height="70" aria-hidden="true"><ellipse cx="100" cy="61" rx="78" ry="2.2" style="fill:#000;opacity:0.35"></ellipse><path d="{{utDark}}" style="fill:#2A3039;stroke:#0A0C10;stroke-width:1;stroke-linejoin:round"></path><path d="{{utBody}}" style="fill:{{utBase}};stroke:#0A0C10;stroke-width:1;stroke-linejoin:round"></path><path d="{{utF1}}" style="fill:{{utAcc}}"></path><path d="{{utF2}}" style="fill:{{utAcc2}}"></path><path d="{{utL1}}" style="fill:none;stroke:{{utAcc}};stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round"></path><path d="{{utPl}}" style="fill:none;stroke:{{utAcc2}};stroke-width:1.6;stroke-linecap:round"></path><path d="{{utHi}}" style="fill:#fff;opacity:0.2"></path><path d="{{utSh}}" style="fill:#000;opacity:0.3"></path><path d="{{utWear}}" style="fill:none;stroke:#fff;stroke-width:0.5;opacity:0.4"></path></svg>
<div style="font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u041F\u043E\u043B\u0443\u0447\u0430\u0435\u0442\u0435</div>
<div style="font-size:18px;font-weight:600">{{upTgtName}}</div>
<div style="font-size:14px;color:var(--accent)">{{upTgtValue}}</div>
<div style="font-size:12px;color:var(--muted)">\u041F\u0430\u0442\u0442\u0435\u0440\u043D \u0432\u044B\u043F\u0430\u0434\u0435\u0442 \u0441\u043B\u0443\u0447\u0430\u0439\u043D\u044B\u0439, \u043E\u0442 1 \u0434\u043E 100</div>
</div>
</div>

<button type="button" onClick="{{ doUpgrade }}" disabled="{{ upDisabled }}" style="width:100%;max-width:440px;min-height:60px;padding:0 36px;border:0;border-radius:10px;background:{{upBtnBg}};color:{{upBtnFg}};font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">{{upBtnLabel}}</button>

<sc-if value="{{ hasUpResult }}" hint-placeholder-val="{{ false }}">
<div class="rise" style="width:100%;max-width:560px;box-sizing:border-box;padding:16px 20px;border-radius:12px;background:var(--bg);border:2px solid {{upResultColor}};box-shadow:0 0 30px -6px {{upResultColor}};display:flex;flex-direction:column;gap:6px;text-align:center">
<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;letter-spacing:0.12em;text-transform:uppercase;color:{{upResultColor}};text-shadow:0 0 16px {{upResultColor}}">{{upBannerTitle}}</div>
<div style="font-size:15px;font-weight:600">{{upResultText}}</div>
</div>
</sc-if>

<sc-if value="{{ hasUpHist }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:8px;width:100%">
<div style="font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">\u0418\u0441\u0442\u043E\u0440\u0438\u044F \u0430\u043F\u0433\u0440\u0435\u0439\u0434\u043E\u0432</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ upHistList }}" as="uh" hint-placeholder-count="0">
<div style="padding:6px 12px;border-radius:20px;border:1px solid {{uh.color}};color:{{uh.color}};font-size:12px;font-weight:600">{{uh.text}}</div>
</sc-for>
</div>
</div>
</sc-if>
</div>

<div style="display:flex;flex-wrap:wrap;gap:24px">
<div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px">
